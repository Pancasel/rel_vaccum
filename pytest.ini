[pytest]
testpaths = tests
addopts = -q --basetemp=.pytest_tmp
markers =
    slow: long test (> 10 s); skip with -m "not slow"
# Harmless gymnasium env_checker warnings (rule 0.3.8):
# - "Not able to test alternative render modes": our envs are not registered with gymnasium.make;
#   every render mode is tested explicitly in tests/test_env.py instead.
# - "different from the unwrapped version": we intentionally check the HideCleanedChannel wrapper.
filterwarnings =
    ignore:.*Not able to test alternative render modes.*:UserWarning
    ignore:.*is different from the unwrapped version.*:UserWarning
